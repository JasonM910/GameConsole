server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://gamestats:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location = /health {
        proxy_pass http://gamestats:8080/health;
        proxy_read_timeout 5s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
